name: Deploy to Cloudflare Pages

# Build the Vite SPA in web/ and deploy it (plus the /api/* Pages Functions)
# to Cloudflare Pages on every push to main that touches app code.
#
# One-time setup — add two repository SECRETS under
# Settings -> Secrets and variables -> Actions -> Secrets:
#   CLOUDFLARE_API_TOKEN   A Cloudflare API token with the "Cloudflare Pages: Edit"
#                          permission (and access to the account below).
#   CLOUDFLARE_ACCOUNT_ID  Your Cloudflare account ID (Dashboard -> Workers & Pages
#                          -> Account details, or the hex id in the dashboard URL).
#
# The Access config vars (TEAM_DOMAIN, ACCESS_AUD) and the R2/KV bindings come
# from wrangler.toml and are applied by the deploy — no need to set them here.

on:
  push:
    branches: [main]
    # Only run when something that affects the deployed app changes.
    paths:
      - "web/**"
      - "functions/**"
      - "worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Cancel an in-flight deploy if a newer push arrives.
concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # Typecheck gate — a broken build fails the Action here, before any deploy.
      - name: Build web (tsc + vite)
        run: npm run build
        working-directory: web

      # Typecheck the Pages Functions + Worker handler against the root config.
      - name: Install root dependencies
        run: npm ci

      - name: Typecheck Pages Functions
        run: npx tsc --noEmit -p functions/tsconfig.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name pdf-reader
