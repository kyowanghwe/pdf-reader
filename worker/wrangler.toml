name = "pdf-reader-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# R2 bucket holding the PDF files. Object key scheme: user/<userId>/<fileHash>.pdf
# Create it once with:  wrangler r2 bucket create pdf-reader-pdfs
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "pdf-reader-pdfs"

# KV namespace holding document metadata, highlights, and progress.
# Create it once with:  wrangler kv namespace create HL_KV
# then paste the returned id below (see README for the exact steps).
[[kv_namespaces]]
binding = "HL_KV"
id = "dc5d768ec1fd435197c6414dff6327ad"

[vars]
# Allowed CORS origin. '*' is fine for local dev; set it to the GitHub Pages
# origin (e.g. https://<user>.github.io) for production.
ALLOWED_ORIGIN = "https://kyowanghwe.github.io"
